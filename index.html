 ['單簧管 / 謝介豪','fy_xie','富瑜室內樂團單簧管演奏家。畢業於台北藝術大學管絃與擊樂研究所，師承陳威稜、楊喬惠與黃貞華等教授；求學時期表現優異，多次獲得協奏曲比賽、室內樂比賽、學生音樂比賽大專組優勝等獎項。現為香頌室內樂團單簧管首席、TMO 台北音樂家管弦樂團單簧管首席、新逸交響樂團；經常受邀發表當代作品，包含亞洲作曲家聯盟、現代音樂協會、小巨人絲竹樂團、十方樂集等。擔任 BON 單簧管重奏團團長，2015 年推出第一部單簧管四重奏兒童音樂劇場「真實夢境」、2020 年推出最新的劇作「夢幻森林」，為台灣單簧管表演藝術注入一番新的活力。目前擔任法國馬卡簧片（Marca Reed）合作音樂家，使用樂器為法國 SELMER MUSE（台灣 SELMER 總代理海潮樂器贊助）。'],
 ['鋼琴 / 王文娟','fy_wwj','富瑜室內樂團鋼琴家。於國立台北藝術大學取得音樂藝術博士學位。師事魏樂富、陳泰成、蔡佳憓、Mikhail Kollontay、Marina Drozdowa、吳瑩珊等教授。曾擔任北藝大 2009-2010 駐校藝術家、入選 2009 兩廳院林肯中心室內樂工作坊、獲 2007 國臺交鋼琴協奏曲大賽之「最佳國人作品演奏獎」、2004 建華愛樂古典菁英獎「建華獎」。在 2001 年日本琉球 Sugar Hall 新人甄選大賽中入選，受到當地沖繩日報評為『自由自在、感動人心的演出』。2000 年獲邀於俄國 Tambov 拉赫曼尼諾夫青年鋼琴家大賽系列音樂會演出。2015-17 獲邀為「台北舞蹈空間 X 譚盾計畫—迴 HUI」現場演奏鋼琴家。2017 年十月獲台中歌劇院邀請合作演出歌劇院巨人系列—向井山朋子《繁複第三號：給四部鋼琴的頑固低音之歌》。曾為國立實驗合唱團專任鋼琴。目前任教於私立實踐大學音樂系、光仁高中等。']]};

const RULES_HTML=`<h2 style="text-align:center">📖 完整規則</h2><p>你是一個喉嚨永遠很癢的愛樂人。騎上機車，跑遍台北 <b>${VENUES.length} 個音樂場館</b>集滿音樂護照！</p>

 <p>🛵 <b>操作</b>：左半邊拖曳搖桿騎車，右半邊滑動轉視角；電腦用 WASD 移動、←→ 轉視角，到門口按空白鍵進場。</p>
 <p>😷 <b>音樂會</b>：喉嚨會越來越癢。古典場在弱音時咳嗽，旁邊的人會直接揍你；每挨一拳惡名星等 +1，下一拳更痛。</p>
 <p>⚠️ <b>突發狀況</b>：國家音樂廳、中山堂、北藝中心、富瑜音樂沙龍會出現手機響、打瞌睡、遲到、偷拍、紅白塑膠袋、急尿、最後一音搶鼓掌等狀況，選錯就挨揍。</p>
 <p>⏰ <b>準時入場</b>：音樂會大多晚上 7:30 開演，週末另有下午 2:30 場（小巨蛋只有晚上場；富瑜音樂沙龍是週六上午 11:00）。開演前 30 分鐘開放入場，準時到有禮儀 +15、樂迷點數 +30；太早到可以在門口等。遊戲從週六上午 10:00 開始：建議先去 🎹 富瑜音樂沙龍（11:00），再看 ⚔️ 水源劇場《樂舞》（14:30），這兩場分數 ×2，一開始就能衝高分！</p><p>🛵 <b>沿路狀況</b>：紅燈、阿嬤過馬路、兩段式左轉、雷陣雨、街頭藝人、夜市雞排⋯⋯守規矩會加下一場的禮儀分，但也會花時間；亂來會被開罰單、惡名上升。</p><p>🩴 <b>入場規定</b>：穿藍白拖不能進任何音樂場館！忘了帶實體票？大場館可以出示手機 QR Code，但小型沙龍沒有掃描器只收紙本票；進場常遇到找不到座位的長輩，幫個忙吧。🥤 手上有任何飲料都會被擋下，要放在門外置放桌。</p><p>🌆 <b>城市生活</b>：黃色垃圾車放〈少女的祈禱〉、📻 機車電台、🏪 便利商店補貨、🧋 珍奶外送賺樂迷點數換好位、🚨 惡名高時樂迷糾察隊會追你、🎼 收集 12 片樂譜、🌧 午後雷陣雨、📸 地標打卡。</p>
